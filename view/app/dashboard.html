<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-gray-900 to-slate-900 text-gray-200">
  <div class="min-h-screen lg:flex">
    <aside id="sidebar" class="fixed inset-y-0 left-[-20px] z-40 w-[320px] -translate-x-full overflow-hidden border-r border-blue-900 bg-gray-900/95 shadow-2xl transition-transform duration-300 ease-in-out lg:z-auto lg:translate-x-0 lg:shadow-none ml-2">
      <div class="flex h-full w-full flex-col items-center gap-6 p-5">
        <div class="flex w-full items-center justify-center gap-3 rounded-xl border border-blue-900 bg-gray-800 p-4 text-center">
          <img id="profileImage" class="h-12 w-12 rounded-full border-2 border-blue-900 object-cover" src="https://i.pravatar.cc/120?img=15" alt="Profile" />
          <div>
            <h3 id="profileName" class="text-sm font-semibold">User Name</h3>
            <p id="profileRole" class="mt-0.5 text-xs text-gray-400">Data Manager</p>
          </div>
        </div>

        <nav class="grid w-full gap-2.5 text-center">
          <a class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm text-gray-200 transition hover:translate-x-0.5 hover:border-blue-900" href="dashboard.html">Dashboard</a>
          <a class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm text-gray-200 transition hover:translate-x-0.5 hover:border-blue-900" href="./js/myFile.html">My Files</a>
          <a class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm text-gray-200 transition hover:translate-x-0.5 hover:border-blue-900" href="./js/history.html">History</a>
          <a class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm text-gray-200 transition hover:translate-x-0.5 hover:border-blue-900" href="#">Logout</a>
        </nav>

        <section class="mt-1 w-full border-t border-gray-800 pt-4 text-center">
          <h4 class="mb-2.5 text-sm font-medium text-gray-400">Media Summary</h4>
          <div class="grid gap-2" id="mediaList"></div>
        </section>
      </div>
    </aside>
    <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/45 lg:hidden"></div>

    <main class="w-full min-w-0 p-4 transition-all duration-300 ease-in-out md:p-5 lg:p-6 lg:pl-[320px]" id="mainContent">
      <div class="mb-5 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 border-b border-blue-900 pb-4 w-full">
          <button class="grid h-10 w-10 place-items-center rounded-lg border border-blue-900 bg-gray-900 text-lg text-gray-200" id="burgerBtn" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="text-2xl font-semibold">Analytics Dashboard</h1>
            <p class="mt-1 text-sm text-gray-400">Dynamic data ready for backend integration</p>
          </div>
        </div>
      </div>

      <section class="mb-4 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4" id="analyticsCards"></section>

      <section class="rounded-xl border border-blue-900 bg-gray-900/90 p-4">
        <h3 class="text-lg font-semibold">Recent Activity</h3>
        <div id="activityRows"></div>
      </section>
    </main>
  </div>

  <script src="./js/dashboard.js"></script>
</body>
</html>
